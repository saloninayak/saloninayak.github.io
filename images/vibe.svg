<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbb5e9"/>
      <stop offset="55%" stop-color="#e7c8f2"/>
      <stop offset="100%" stop-color="#f9eef7"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c6a0"/>
      <stop offset="100%" stop-color="#97aa86"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c8d9"/>
      <stop offset="100%" stop-color="#7aa1b8"/>
    </linearGradient>
    <radialGradient id="sun" cx="85%" cy="18%" r="18%">
      <stop offset="0%" stop-color="#f8cfe0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f8cfe0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="360" cy="170" rx="170" ry="50"/>
    <ellipse cx="500" cy="150" rx="140" ry="45"/>
    <ellipse cx="1180" cy="210" rx="220" ry="60"/>
    <ellipse cx="1340" cy="190" rx="170" ry="50"/>
  </g>

  <!-- distant meadow -->
  <path d="M0 610 C 360 520, 760 560, 1080 600 C 1360 630, 1600 640, 1920 600 L 1920 1080 L 0 1080 Z" fill="url(#hills)" opacity="0.72"/>

  <!-- pond -->
  <path d="M0 760 C 300 700, 640 720, 920 760 C 1200 800, 1520 820, 1920 780 L 1920 1080 L 0 1080 Z" fill="url(#pond)" opacity="0.95"/>
  <path d="M0 820 C 320 780, 620 800, 920 835 C 1220 870, 1520 900, 1920 860" fill="none" stroke="#cfe6f1" stroke-opacity="0.65" stroke-width="6"/>
  <path d="M120 860 C 360 830, 620 845, 900 880" fill="none" stroke="#cfe6f1" stroke-opacity="0.45" stroke-width="4"/>

  <!-- water lilies -->
  <g fill="#b7d7a8" opacity="0.95">
    <circle cx="420" cy="880" r="16"/>
    <circle cx="520" cy="900" r="14"/>
    <circle cx="640" cy="870" r="15"/>
    <circle cx="760" cy="905" r="13"/>
    <circle cx="980" cy="885" r="16"/>
    <circle cx="1120" cy="910" r="14"/>
  </g>
  <g fill="#f8f3fb" opacity="0.9">
    <circle cx="420" cy="880" r="6"/>
    <circle cx="640" cy="870" r="5"/>
    <circle cx="980" cy="885" r="6"/>
  </g>

  <!-- swans -->
  <g transform="translate(980 790)" fill="#f7f6f2">
    <ellipse cx="0" cy="0" rx="26" ry="18"/>
    <path d="M-8 -8 C -6 -30, 10 -34, 18 -20" fill="none" stroke="#f7f6f2" stroke-width="6" stroke-linecap="round"/>
    <circle cx="20" cy="-22" r="4" fill="#6b6b6b"/>
  </g>
  <g transform="translate(760 820)" fill="#f7f6f2" opacity="0.9">
    <ellipse cx="0" cy="0" rx="20" ry="14"/>
    <path d="M-6 -6 C -4 -22, 8 -26, 14 -16" fill="none" stroke="#f7f6f2" stroke-width="5" stroke-linecap="round"/>
    <circle cx="15" cy="-18" r="3" fill="#6b6b6b"/>
  </g>
</svg>
